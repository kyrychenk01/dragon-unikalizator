<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Унікалізатор DRAGON TRAFIC</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:rgba(10,10,10,.72);--text:#fff;--muted:#9a9a9a;--line:#333;--glow:rgba(255,255,255,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;background:transparent;color:var(--text);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px;min-height:100vh}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;background:radial-gradient(ellipse at 50% 120%,#1a1a1a 0%,#000 60%)}
.w{max-width:920px;margin:0 auto}
header{text-align:center;padding:28px 0 22px;animation:rise .9s ease both}
.logo{width:96px;height:125px;margin:0 auto 14px;display:block;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,255,255,.55))}
.logo svg,.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(26px,6vw,46px);line-height:1.05;background:linear-gradient(110deg,#777 20%,#fff 45%,#777 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
h1 b{display:block;font-weight:300;letter-spacing:.5em;font-size:.5em;margin-top:6px}
p.s{color:var(--muted);margin:12px 0 0;font-size:14px;font-weight:300}
.card{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;transition:border-color .3s,box-shadow .3s;animation:rise .9s ease both}
.card:hover{border-color:#777;box-shadow:0 0 28px var(--glow)}
.card:nth-of-type(2){animation-delay:.1s}.card:nth-of-type(3){animation-delay:.2s}.card:nth-of-type(4){animation-delay:.3s}
canvas#cv{width:100%;max-height:60vh;background:#000;border-radius:10px;display:block;object-fit:contain;border:1px solid var(--line)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px}
label{font-size:13px;display:block;font-weight:400}
label span{float:right;color:var(--muted)}
input[type=range]{width:100%;accent-color:#fff}
input[type=file]{color:var(--muted);font-family:inherit;font-size:14px;width:100%}
input[type=file]::file-selector-button{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 16px;margin-right:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:transform .2s}
input[type=file]::file-selector-button:hover{transform:scale(1.05)}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button,.f{font-family:inherit;background:#fff;color:#000;border:0;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .2s,box-shadow .2s}
button:hover:not(:disabled),.f:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(255,255,255,.45)}
button.o{background:transparent;color:#fff;border:1px solid #666}
button:disabled{opacity:.35;cursor:default}
#st{font-size:13px;color:var(--muted);font-weight:300}
footer{text-align:center;color:#555;font-size:12px;padding:10px 0 24px;letter-spacing:.3em;text-transform:uppercase}
@keyframes shine{to{background-position:-220% 0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

function sky(){
  warp+=(warpT-warp)*0.04;
  sx.clearRect(0,0,W,H);
  var cx=W/2,cy=H/2;
  stars.forEach(function(s){
    var px=cx+s.x/s.z*W*0.12,py=cy+s.y/s.z*H*0.12;
    s.z-=0.0009*warp;
    if(s.z<=0.02||px<0||px>W||py<0||py>H){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;return}
    var r=(1-s.z)*1.8+0.2,a=Math.min(1,(1-s.z)*1.3);
    if(warp>3){
      var qx=cx+s.x/(s.z+0.04*warp)*W*0.12,qy=cy+s.y/(s.z+0.04*warp)*H*0.12;
      sx.strokeStyle="rgba(255,255,255,"+a+")";sx.lineWidth=r;sx.beginPath();sx.moveTo(qx,qy);sx.lineTo(px,py);sx.stroke();
    }else{sx.fillStyle="rgba(255,255,255,"+a+")";sx.beginPath();sx.arc(px,py,r,0,6.283);sx.fill()}
  });
  if(Math.random()<0.012)shoot.push({x:Math.random()*W,y:Math.random()*H*0.5,vx:6+Math.random()*5,vy:2+Math.random()*3,l:1});
  shoot=shoot.filter(function(m){
    m.x+=m.vx;m.y+=m.vy;m.l-=0.012;
    var g=sx.createLinearGradient(m.x,m.y,m.x-m.vx*12,m.y-m.vy*12);
    g.addColorStop(0,"rgba(255,255,255,"+m.l+")");g.addColorStop(1,"rgba(255,255,255,0)");
    sx.strokeStyle=g;sx.lineWidth=1.6;sx.beginPath();sx.moveTo(m.x,m.y);sx.lineTo(m.x-m.vx*12,m.y-m.vy*12);sx.stroke();
    return m.l>0;
  });
  requestAnimationFrame(sky);
}
sky();

/* ===== відео ===== */
var P=[["brightness","Яскравість",100,85,115,1,"%"],["contrast","Контраст",100,85,115,1,"%"],["saturate","Насиченість",100,80,120,1,"%"],["hue","Відтінок",0,-10,10,1,"°"],["zoom","Збільшення (обрізання)",100,100,112,1,"%"],["speed","Швидкість",100,95,105,1,"%"]];
var V={},cv=$("cv"),ctx=cv.getContext("2d");
var vid=document.createElement("video");vid.playsInline=true;vid.loop=true;
var ctl=$("ctl");
P.forEach(function(p){
  V[p[0]]=p[2];
  var l=document.createElement("label");
  l.innerHTML=p[1]+"<span id='v_"+p[0]+"'>"+p[2]+p[6]+"</span><input type='range' id='r_"+p[0]+"' min='"+p[3]+"' max='"+p[4]+"' step='"+p[5]+"' value='"+p[2]+"'>";
  ctl.appendChild(l);
  l.querySelector("input").oninput=function(e){set(p[0],+e.target.value)};
});
var mir=document.createElement("label");
mir.innerHTML="<input type='checkbox' id='mirror'> Віддзеркалити по горизонталі";
ctl.appendChild(mir);

function set(k,v){
  V[k]=v;
  P.forEach(function(p){if(p[0]==k){$("v_"+k).textContent=v+p[6];$("r_"+k).value=v}});
  if(k=="speed")vid.playbackRate=v/100;
}
$("rst").onclick=function(){P.forEach(function(p){set(p[0],p[2])});$("mirror").checked=false};
$("rnd").onclick=function(){
  P.forEach(function(p){
    var span=(p[4]-p[3])/3,v=Math.round(p[2]+(Math.random()*2-1)*span*0.6);
    if(p[0]=="zoom")v=102+Math.round(Math.random()*6);
    set(p[0],Math.min(p[4],Math.max(p[3],v)));
  });
};

function draw(){
  var w=cv.width,h=cv.height;
  ctx.save();
  ctx.filter="brightness("+V.brightness+"%) contrast("+V.contrast+"%) saturate("+V.saturate+"%) hue-rotate("+V.hue+"deg)";
  var z=V.zoom/100,sw=vid.videoWidth/z,sh=vid.videoHeight/z;
  var ox=(vid.videoWidth-sw)/2,oy=(vid.videoHeight-sh)/2;
  if($("mirror").checked){ctx.translate(w,0);ctx.scale(-1,1)}
  if(vid.videoWidth)ctx.drawImage(vid,ox,oy,sw,sh,0,0,w,h);
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

var ac,dest,src;
$("file").onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  vid.src=URL.createObjectURL(f);
  vid.onloadedmetadata=function(){
    var k=Math.min(1,1280/Math.max(vid.videoWidth,vid.videoHeight));
    cv.width=Math.round(vid.videoWidth*k/2)*2;
    cv.height=Math.round(vid.videoHeight*k/2)*2;
    vid.playbackRate=V.speed/100;
    vid.muted=true;vid.play();
    $("play").disabled=false;$("rec").disabled=false;
    $("st").textContent="Готово. Налаштуйте фільтри.";
  };
};
$("play").onclick=function(){vid.paused?vid.play():vid.pause()};

$("rec").onclick=function(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      src=ac.createMediaElementSource(vid);
      dest=ac.createMediaStreamDestination();
      src.connect(dest);
    }
    var stream=cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)});
    var types=["video/mp4","video/webm;codecs=vp9,opus","video/webm"];
    var mt=types.filter(function(t){return MediaRecorder.isTypeSupported(t)})[0]||"";
    var mr=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:6000000});
    var ch=[];
    mr.ondataavailable=function(ev){if(ev.data.size)ch.push(ev.data)};
    mr.onstop=function(){
      var ext=mt.indexOf("mp4")>-1?"mp4":"webm";
      var b=new Blob(ch,{type:mt||"video/webm"});
      var a=$("dl");a.href=URL.createObjectURL(b);a.download="dragon_trafic."+ext;
      $("out").hidden=false;warpT=1;
      vid.loop=true;$("st").textContent="Готово, завантажте файл нижче.";
      $("rec").disabled=false;
    };
    vid.loop=false;vid.currentTime=0;
    vid.onended=function(){if(mr.state=="recording")mr.stop();vid.onended=null};
    ac.resume();
    $("rec").disabled=true;$("out").hidden=true;warpT=7;
    $("st").textContent="Йде запис у реальному часі, не закривайте вкладку…";
    mr.start();vid.play();
  }catch(err){$("st").textContent="Помилка: "+err.message;$("rec").disabled=false;warpT=1}
};
</script>
